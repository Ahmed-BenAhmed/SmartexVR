name: Unity Build

# Builds the SmartexVR project for Android (always) and iOS (when a macOS
# runner is available). Runs on PRs to master and on pushes to master.
#
# Prerequisites (configure once in repo Settings → Secrets):
#   UNITY_LICENSE           Full <Unity_*_License.ulf> contents (Personal or Pro)
#   UNITY_EMAIL             The email tied to the license
#   UNITY_PASSWORD          Password for the Unity account
#   ANDROID_KEYSTORE_BASE64 (optional, release only) base64 of the upload .keystore
#   ANDROID_KEYSTORE_PASS   (optional, release only) keystore password
#   ANDROID_KEYALIAS_NAME   (optional, release only)
#   ANDROID_KEYALIAS_PASS   (optional, release only)
#
# This is a skeleton — tune the Unity version / build targets / caching as the
# project matures. game-ci/unity-builder tracks most Unity versions within a
# day or two of release.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.11f1
  PROJECT_PATH: .

jobs:
  # ── Android APK — runs on every PR ─────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Ubuntu runners ship with ~14 GB free. The Unity Android editor image
      # is ~10 GB and the build itself needs another several GB — without
      # this step, `docker pull` dies mid-layer with ENOSPC. This action
      # strips pre-installed dotnet / haskell / swift / android-sdk that
      # Unity doesn't touch and reclaims ~30 GB.
      - name: Free up runner disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          projectPath: ${{ env.PROJECT_PATH }}
          buildName: SmartexVR
          androidExportType: androidPackage
          # Sidestep unity-builder's broken Unity-6 Personal activation
          # (it runs a legacy serial validation after the entitlement
          # license activates, trips on the "x" fallback, fails with
          # code 20110). We pre-seed the entitlement XML where the
          # editor looks for it and let Unity activate itself on launch.
          skipActivation: true
          preBuildSteps: |
            mkdir -p /root/.local/share/unity3d/Unity/licenses
            printf '%s' "$UNITY_LICENSE" > /root/.local/share/unity3d/Unity/licenses/UnityEntitlementLicense.xml
            echo "Pre-seeded entitlement license ($(wc -c < /root/.local/share/unity3d/Unity/licenses/UnityEntitlementLicense.xml) bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartexVR-Android-${{ github.sha }}
          path: build/Android
          retention-days: 14

  # ── iOS build — best-effort; only runs if a macOS runner minute budget
  #    is available. macOS minutes cost ~10× ubuntu, so gate on push to master
  #    rather than every PR.
  build-ios:
    name: Build iOS (optional)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Force empty — otherwise unity-builder defaults it to the string
          # "x" and Unity 6's LicensingClient validates that as a Pro serial
          # AFTER the Personal entitlement activation succeeds, fails with
          # code 20110 ("serial invalid"), and aborts the whole build.
          UNITY_SERIAL: ""
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          projectPath: ${{ env.PROJECT_PATH }}
          buildName: SmartexVR

      - uses: actions/upload-artifact@v4
        with:
          name: SmartexVR-iOS-Xcode-${{ github.sha }}
          path: build/iOS
          retention-days: 14

  # ── EditMode + PlayMode tests ──────────────────────────────────────────────
  test:
    name: Unity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free up runner disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Test-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}

  # ── Secrets guard — fail if anyone commits a Vuforia key shape ─────────────
  secrets-guard:
    name: Secrets guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed Vuforia-shaped keys
        run: |
          # Vuforia license keys are long (>= 500 chars) base64-ish blobs. The
          # conservative guard: any file that contains a double-quoted string
          # longer than 400 chars outside of LICENSE/THIRD-PARTY notices.
          set -e
          if grep -RInE '"[A-Za-z0-9+/=]{400,}"' \
               --include='*.cs' --include='*.unity' --include='*.asset' \
               --exclude-dir='Library' --exclude-dir='Build' .; then
            echo "::error::Possible embedded secret detected. Load secrets via ARConfig.Instance at runtime instead."
            exit 1
          fi
