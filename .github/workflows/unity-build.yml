name: Unity CI

# Tests + secrets guard only. Android/iOS builds are handled by Unity Build
# Automation (cloud.unity.com → Build Automation), because Unity Personal
# entitlements cannot be activated in ephemeral Linux containers — the
# LicensingClient phones home for an access token that doesn't exist in CI.
# UBA provisions the license automatically for Personal users.
#
# Prerequisites (configure once in repo Settings → Secrets):
#   UNITY_LICENSE   Full UnityEntitlementLicense.xml contents
#   UNITY_EMAIL     The email tied to the license
#   UNITY_PASSWORD  Password for the Unity account
#
# Note: if the test job also starts failing with entitlement errors, drop it
# and run tests locally before pushing. unity-test-runner has historically
# been more forgiving than unity-builder, but both depend on the same
# LicensingClient — no guarantees.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.11f1
  PROJECT_PATH: .

jobs:
  # ── EditMode + PlayMode tests ──────────────────────────────────────────────
  test:
    name: Unity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free up runner disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Test-
            Library-

      # Same host-side pre-seed trick as before: write the entitlement XML to
      # the host path that gets bind-mounted to /root inside the test-runner
      # container. Not guaranteed to work for Personal (see header comment).
      - name: Pre-seed Unity entitlement license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          LICENSE_DIR="$RUNNER_TEMP/_github_home/.local/share/unity3d/Unity/licenses"
          mkdir -p "$LICENSE_DIR"
          printf '%s' "$UNITY_LICENSE" > "$LICENSE_DIR/UnityEntitlementLicense.xml"
          BYTES=$(wc -c < "$LICENSE_DIR/UnityEntitlementLicense.xml")
          echo "Wrote $BYTES bytes to $LICENSE_DIR/UnityEntitlementLicense.xml"
          if [ "$BYTES" -lt 1000 ]; then
            echo "::warning::License file is suspiciously small — UNITY_LICENSE secret may be empty or truncated"
          fi

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}

  # ── Secrets guard — fail if anyone commits a Vuforia key shape ─────────────
  secrets-guard:
    name: Secrets guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed Vuforia-shaped keys
        run: |
          # Vuforia license keys are long (>= 500 chars) base64-ish blobs. The
          # conservative guard: any file that contains a double-quoted string
          # longer than 400 chars outside of LICENSE/THIRD-PARTY notices.
          set -e
          if grep -RInE '"[A-Za-z0-9+/=]{400,}"' \
               --include='*.cs' --include='*.unity' --include='*.asset' \
               --exclude-dir='Library' --exclude-dir='Build' .; then
            echo "::error::Possible embedded secret detected. Load secrets via ARConfig.Instance at runtime instead."
            exit 1
          fi
