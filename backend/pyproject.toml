[project]
name = "smartex-vr-backend"
version = "0.1.0"
description = "FastAPI backend for SmartexVR textile-machine telemetry, AR workflows, and AI assistance."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "influxdb-client>=1.48.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
